name: Bug report
description: Something does not work the way it should
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where are you running it
      options:
        - Windows PC
        - Google Colab
        - Claude Code
        - Linux or macOS
        - The landing page
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `git rev-parse --short HEAD`, or the date you cloned it.
  - type: textarea
    id: details
    attributes:
      label: Error text or screenshot
      description: Paste any message from the app or the terminal. Do not paste API keys, and keep private recordings out of public issues.
      render: shell
